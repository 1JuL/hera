<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Senzaccento - Login Hera</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-left">
      <h2 style="font-family:Georgia, serif; margin-bottom: 30px;">Senzaccento</h2>
      <div class="login-box">
        <h1>Sign In</h1>
        <p class="subtitle">Don't have an account? <a href="#">Create now</a></p>
        <form onsubmit="login(event)">
          <div class="input-group">
            <label>E-mail</label>
            <input type="email" value="example@gmail.com" required>
          </div>
          <div class="input-group">
            <label>Password</label>
            <input type="password" value="********" required>
          </div>
          <button type="submit" class="btn-primary" style="width: 100%; border-radius:20px; margin-top:10px;">Sign in</button>
        </form>
        <button class="btn-social">Continue with Google</button>
        <button class="btn-social">Continue with Facebook</button>
      </div>
    </div>
    <div class="login-right">
      <div>Support</div>
      <div style="font-size: 12px; opacity: 0.7;">© 2026 Senzaccento Inc.</div>
    </div>
  </div>
  <script src="js/auth.js"></script>
</body>
</html>
